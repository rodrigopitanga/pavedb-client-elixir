stages:
  - mirror
  - test
  - release
  - announce

.stable-tag: &stable-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

mirror-github:
  image: alpine:3.20
  stage: mirror
  variables:
    GITHUB_MIRROR_REPO: rodrigopitanga/pavedb-client-elixir
  before_script:
    - apk add --no-cache git
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
    - git remote remove github-mirror 2>/dev/null || true
    - |
      github_url="https://x-access-token:${GITHUB_MIRROR_TOKEN}"
      github_url="${github_url}@github.com/${GITHUB_MIRROR_REPO}.git"
      git remote add github-mirror "$github_url"
    - |
      main_ref="+refs/heads/${CI_DEFAULT_BRANCH}:"
      main_ref="${main_ref}refs/remotes/origin/${CI_DEFAULT_BRANCH}"
      git fetch origin "$main_ref" "+refs/tags/*:refs/tags/*"
    - |
      main_dst="refs/remotes/origin/${CI_DEFAULT_BRANCH}:"
      main_dst="${main_dst}refs/heads/${CI_DEFAULT_BRANCH}"
      git push github-mirror "$main_dst"
    - git push github-mirror "refs/tags/*:refs/tags/*"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

elixir:
  image: elixir:1.17-otp-27-alpine
  stage: test
  before_script:
    - apk add --no-cache bash make
    - mix local.hex --force
  script:
    - mix deps.get
    - mix format --check-formatted
    - mix compile --warnings-as-errors
    - mix test
    - make release-tarball-check

docs-tarball:
  image: elixir:1.17-otp-27-alpine
  stage: test
  before_script:
    - apk add --no-cache bash make
    - mix local.hex --force
  script:
    - mix deps.get
    - make release-tag-check
    - make release-tarball-check
  artifacts:
    paths:
      - dist/*.tar
      - docs/reference/api.md
    expire_in: never
  <<: *stable-tag

publish-hex:
  image: elixir:1.17-otp-27-alpine
  stage: release
  needs:
    - job: elixir
    - job: docs-tarball
      artifacts: true
  before_script:
    - apk add --no-cache curl jq
    - mix local.hex --force
  script:
    - mix deps.get
    - test -n "${HEX_API_KEY:-}" || { echo "HEX_API_KEY is missing"; exit 1; }
    - mix hex.publish --yes
    - |
      set -e
      if [ "$CI_COMMIT_TAG" = "v0.2.0" ]; then
        mix hex.retire pavedb_client 0.1.1 other \
          --message "Retired release; use 0.2.0."
        curl --fail --silent --show-error \
          https://hex.pm/api/packages/pavedb_client/releases/0.1.1 \
          | jq -e '.retirement.reason == "other"' > /dev/null
      fi
  <<: *stable-tag

release-notes:
  image: alpine:3.20
  stage: release
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      pattern="$(printf '%s' "$version" | sed 's/[].[^$*\\]/\\&/g')"
      awk -v pattern="$pattern" '
        $0 ~ "^## " pattern "([ \t]|$)" { found = 1; next }
        found && /^## / { exit }
        found && /^---$/ { exit }
        found && !started && NF { started = 1 }
        found && started { print }
        END { if (!found || !started) exit 1 }
      ' CHANGELOG.md > release-notes.md
      test -s release-notes.md
      printf 'PaveDB Elixir Client %s\n' "$version" > release-title.txt
  artifacts:
    paths:
      - release-notes.md
      - release-title.txt
  <<: *stable-tag

announce-gitlab:
  image: registry.gitlab.com/gitlab-org/cli:latest
  stage: announce
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: publish-hex
    - job: release-notes
      artifacts: true
  script:
    - |
      glab release create "$CI_COMMIT_TAG" --name "$(cat release-title.txt)" \
        --notes-file release-notes.md --ref "$CI_COMMIT_SHA"
  <<: *stable-tag

announce-github:
  image: alpine:3.20
  stage: announce
  needs:
    - job: mirror-github
    - job: publish-hex
    - job: release-notes
      artifacts: true
  before_script:
    - apk add --no-cache git github-cli
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
      export GH_TOKEN="$GITHUB_MIRROR_TOKEN"
    - |
      git ls-remote --exit-code \
        "https://github.com/rodrigopitanga/pavedb-client-elixir.git" \
        "refs/tags/${CI_COMMIT_TAG}"
    - |
      if gh release view "$CI_COMMIT_TAG" \
        --repo rodrigopitanga/pavedb-client-elixir >/dev/null 2>&1; then
        gh release edit "$CI_COMMIT_TAG" \
          --repo rodrigopitanga/pavedb-client-elixir \
          --title "$(cat release-title.txt)" --notes-file release-notes.md
      else
        gh release create "$CI_COMMIT_TAG" \
          --repo rodrigopitanga/pavedb-client-elixir --verify-tag \
          --title "$(cat release-title.txt)" --notes-file release-notes.md
      fi
  <<: *stable-tag
